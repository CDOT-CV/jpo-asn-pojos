plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
    id("io.freefair.lombok") version "9.8.2"
    id 'jacoco'
    id 'jacoco-report-aggregation'
    id("com.diffplug.spotless") version "8.10.4"
}

group = 'io.github.usdot-jpo-ode'
version = '2.0.0-beta2-SNAPSHOT'

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    lombok 'org.projectlombok:lombok:1.18.48'

    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.1'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
    testImplementation 'commons-io:commons-io:2.18.0'
    testImplementation 'org.xmlunit:xmlunit-core:2.10.0'
    testImplementation 'org.xmlunit:xmlunit-matchers:2.10.0'
    testImplementation 'net.javacrumbs.json-unit:json-unit:6.2.0'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    api 'tools.jackson.dataformat:jackson-dataformat-xml:3.1.8'

    api 'io.github.usdot-jpo-ode:jpo-asn-runtime'

    implementation 'org.slf4j:slf4j-api:2.0.5'
    implementation 'org.slf4j:slf4j-simple:2.0.5'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Keep backwards compatibility with consumers still using Java 21
tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

// The generated classes have no comments; skip the thousands of "no comment" warnings.
// They are still included in the javadoc.
tasks.withType(Javadoc).configureEach {
    options.addBooleanOption('Xdoclint:all,-missing', true)
}

// JaCoCo 0.8.14+ is required to run tests on a Java 25 JVM
jacoco {
    toolVersion = '0.8.14'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('check') {
    dependsOn tasks.named('testCodeCoverageReport', JacocoReport)
}

spotless {
    // Keep each file's existing line endings rather than Spotless 8's default, which rewrites CRLF files to LF
    lineEndings = com.diffplug.spotless.LineEnding.PRESERVE
    java {
        targetExclude('**/package-info.java',
             '**/test/**/*.*',
             '**/resources/**/*.*')
        googleJavaFormat('1.36.1').skipJavadocFormatting()
    }
}

compileJava.dependsOn 'spotlessApply'
