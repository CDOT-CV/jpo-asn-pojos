plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id("io.freefair.lombok") version "9.7.0"
    id 'com.gradleup.shadow' version '8.3.6'
    id("com.diffplug.spotless") version "7.0.2"
    id 'jacoco'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
    implementation 'tools.jackson.dataformat:jackson-dataformat-xml:3.1.7'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'commons-io:commons-io:2.18.0'
    implementation 'commons-beanutils:commons-beanutils:1.11.0'
    implementation 'info.picocli:picocli:4.7.7'
    implementation 'usdot.jpo.asn:jpo-asn-runtime'
    implementation 'usdot.jpo.asn:jpo-asn-j2735-2024'

    implementation 'org.slf4j:slf4j-api:2.0.5'
    implementation 'org.slf4j:slf4j-simple:2.0.5'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'us.dot.its.jpo.asn.testgenerator.TestGenCli'
}

test {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named("shadowJar") {
    setProperty('zip64', true)
    archiveBaseName = 'testgen'
    archiveClassifier = 'cli'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'us.dot.its.jpo.asn.testgenerator.TestGenCli'
        )
    }
    archiveBaseName = 'testgen'
}

spotless {
    java {
        googleJavaFormat('1.21.0').skipJavadocFormatting()
    }
}

compileJava.dependsOn 'spotlessApply'